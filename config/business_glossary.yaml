glossary:
  name: ecommerce-glossary
  display_name: "Lumi\xE8reShop Executive Retail Glossary (140 Tables Complete)"
  description: "Enterprise semantic glossary defining retail business metrics, e-commerce\
    \ KPIs, operational failure modes, and BigQuery column bindings across all 17\
    \ domains for Lumi\xE8reShop."
  categories:
  - id: marketing
    display_name: Paid Acquisition & Marketing
    description: Paid social, search, influencer marketing, ad algorithms, and conversion
      metrics.
  - id: supply_chain
    display_name: Supply Chain & Warehousing
    description: Inventory levels, stockouts, warehouse physical hubs, and batch replenishments.
  - id: logistics
    display_name: Fulfillment & Regional Logistics
    description: Carrier performance, lead-time SLAs, regional delivery promises,
      and cart abandonment.
  - id: pricing_merchandising
    display_name: Pricing & Merchandising
    description: Competitor price scrapes, promotional discounts, and catalog recommendation
      systems.
  - id: technical_checkout
    display_name: Digital Experience & Payments
    description: Payment service providers (PSP), gateway error codes, and consent
      management tracking.
  - id: finance
    display_name: Commercial Targets & Financial Performance
    description: Gross revenue, financial pacing, commercial target variance, and
      margin calculations.
  - id: returns_rma
    display_name: Returns, Refunds & RMA Management
    description: Product return authorizations, inspection triage, refund processing,
      and return rates.
  - id: customer_service
    display_name: Customer Support, CRM & CSAT
    description: Helpdesk ticketing, first contact resolution, customer satisfaction
      (CSAT), and NPS.
  - id: loyalty_retention
    display_name: Customer Loyalty, Rewards & Retention
    description: Loyalty tier memberships, points ledger, rewards redemption, and
      gift card balances.
  - id: omnichannel_pos
    display_name: Retail Physical Stores & Omni-Channel POS
    description: Physical store registers, in-person transactions, click & collect
      (BOPIS), and store inventory.
  - id: product_pim
    display_name: Product Information Management & Catalog Master
    description: Product master taxonomy, localized translations, size charts, and
      attribute completeness.
  - id: lifecycle_marketing
    display_name: Lifecycle Marketing, Email & Campaigns
    description: Email deliverability, template conversions, bounce tracking, affiliate
      publisher commissions, and coupon promotions.
  - id: staging_ingestion
    display_name: Raw Ingestion & Third-Party Partner Feeds
    description: Staging pipelines and raw API feeds from Shopify, Meta, Google Ads,
      Stripe, Adyen, Zendesk, SAP ERP, and GA4.
  - id: data_governance
    display_name: Data Governance, Quality & Interaction Auditing
    description: Agent interaction logs, query execution telemetry, data profiling
      scans, and table access auditing.
  - id: temporal_context
    display_name: Temporal Simulation & Calendar Context
    description: "Semantic temporal anchor definitions, relative calendar mappings\
      \ ('this week', 'today', 'yesterday', 'previous week', 'MTD'), and date bounds\
      \ for Lumi\xE8reShop retail and promotional calendar periods."
  terms:
  - id: roas
    display_name: ROAS (Return on Ad Spend)
    category_id: marketing
    definition: "Ambiguous on its own. LumiereShop maintains two certified and materially different return-on-ad-spend conventions. Use the paid-attributed convention when assessing campaign or automated bidding performance, and the blended convention when assessing performance against the commercial plan. The blended figure is roughly twice the paid figure, so a report that does not state which convention it uses cannot be interpreted."
    formula: "Not defined without a qualifier; state the paid or blended convention explicitly."
    synonyms:
    - ad efficiency
    - marketing ROI
    - ad return
    - campaign return
    - ad spend efficiency
    bindings:
    - table: daily_ad_performance
      column: spend
    - table: daily_category_targets
      column: target_roas
    - table: orders
      column: total_amount
  - id: cpc
    display_name: CPC (Cost Per Click)
    category_id: marketing
    definition: The average financial amount billed by the advertising network for
      each user click interaction.
    formula: SUM(spend) / SUM(clicks)
    synonyms:
    - cost per click
    - click cost
    - ad traffic cost
    bindings:
    - table: daily_ad_performance
      column: average_cpc
  - id: cvr
    display_name: CVR (E-Commerce Conversion Rate)
    category_id: marketing
    definition: "Ambiguous on its own. LumiereShop certifies two conversion-rate conventions: the paid-only figure used to assess campaigns, and the sitewide figure used to assess overall trading. They differ because paid traffic converts differently from returning organic and email traffic. State which convention is in use."
    formula: "Not defined without a qualifier; state the paid or sitewide convention explicitly."
    synonyms:
    - conversion rate
    - checkout conversion
    - sales conversion
    bindings:
    - table: daily_category_targets
      column: target_conversion_rate
  - id: learning_limited
    display_name: Learning Limited (Ad Platform Status)
    category_id: marketing
    definition: Algorithmic state in Meta Ads/Google Ads where an ad set fails to
      exit the initial machine learning phase or becomes restricted due to creative
      fatigue or low conversion volume.
    formula: "ad_creatives.dlv_lrn_lmt_flg = TRUE, corroborated by ad_bidding_log.status_change = 'LEARNING_LIMITED'"
    synonyms:
    - ad fatigue
    - algorithm lockout
    - creative fatigue
    - stuck campaign
    bindings:
    - table: ad_creatives
      column: dlv_lrn_lmt_flg
    - table: ad_bidding_log
      column: action_taken
  - id: target_roas_throttling
    display_name: Target ROAS Budget Throttling
    category_id: marketing
    # The convention warning lives at the FRONT of this definition on purpose.
    # Knowledge Catalog truncates term descriptions at 1000 characters from the
    # tail, so anything important has to come first.
    #
    # WHY IT IS HERE AND NOT IN `paid_roas` / `blended_roas`: the single CMO
    # prompt the app and the setup script both use does not surface those two
    # terms - measured 2026-09-13 - but it does surface this one. Rather than
    # reword a prompt that is a sharp local optimum, the warning was moved to
    # the term that is actually delivered to the agent. This is what keeps
    # benchmark question B-S2 (the ROAS convention collision) alive.
    definition: "CONVENTION WARNING: two ROAS conventions exist; never compare them. Paid ROAS counts only paid-channel revenue and is what the bidding algorithm optimises against and throttles on. Blended ROAS counts all revenue regardless of channel and is the plan convention, stored in daily_category_targets.target_roas. Blended runs roughly twice paid, so judging paid ROAS against the blended plan target makes a throttled campaign look healthy. Throttling is the automated cut to a campaign's daily budget once its PAID return on ad spend falls below target; the trailing window means the cap can persist after efficiency recovers."
    formula: "ad_bidding_log.budget_multiplier < 1.0 means a throttle is in force. Onset: status_change = 'TARGET_ROAS_BREACH_THROTTLED' with action_taken = 'BUDGET_CAP_APPLIED'. Cap held after recovery: status_change = 'BUDGET_CONSTRAINED'. State which convention any ROAS figure uses."
    synonyms:
    - budget throttling
    - spend cut
    - algorithm throttling
    - ad spend reduction
    bindings:
    - table: ad_bidding_log
      column: action_taken
    - table: daily_ad_performance
      column: spend
  - id: throttling_lost_revenue
    display_name: Ad Throttling Lost Revenue
    category_id: marketing
    definition: "Revenue not realised because automated budget throttling starved the category of paid traffic. Certified as a residual, not a direct measurement: the traffic collapse overlaps the on-site frictions that triggered it, so measuring every cause independently would double count. Subtract the certified Stockout and Recommender Mismatch losses from the category revenue deficit; the remainder is attributable to the traffic collapse. A direct estimate from the session shortfall (missing sessions x conversion rate x average order value) should be produced as a cross-check: it brackets the residual rather than replacing it."
    formula: "category revenue deficit - Stockout Estimated Lost Revenue - Recommender Mismatch Lost Revenue. Scope the deficit and both certified losses to the same category and the same reporting window."
    synonyms:
    - throttling loss
    - paid traffic deficit loss
    - budget cap loss
    - ad spend throttling impact
    bindings:
    - table: ad_bidding_log
      column: budget_multiplier
    - table: ad_bidding_log
      column: status_change
    - table: category_15min_targets
      column: target_sessions
    - table: web_sessions
      column: session_id
  - id: influencer_revenue
    display_name: Influencer Attributed Revenue
    category_id: marketing
    definition: Gross merchandise value generated directly through creator promotion
      codes (e.g. TikTok, Instagram).
    formula: actual_revenue from influencer_campaigns
    synonyms:
    - creator revenue
    - influencer sales
    - promo code sales
    bindings:
    - table: influencer_campaigns
      column: actual_revenue
    - table: influencer_campaigns
      column: creator_name
  - id: oos
    display_name: Out of Stock (OOS / Stockout)
    category_id: supply_chain
    definition: State when physical inventory quantity for an active product at a
      distribution center drops to zero or below.
    formula: stock_quantity <= 0 OR is_out_of_stock = TRUE
    synonyms:
    - stockout
    - unavailable
    - sold out
    - inventory depletion
    - zero stock
    bindings:
    - table: inventory_snapshots
      column: is_out_of_stock
    - table: inventory_items
      column: quantity_on_hand
  - id: stockout_lost_revenue
    display_name: Stockout Estimated Lost Revenue
    category_id: supply_chain
    definition: "Revenue not realised when a shopper hit an out-of-stock SKU. NEVER report SUM(oos_interactions.pot_val) as lost revenue: it overstates the loss by more than an order of magnitude. pot_val is the GROSS basket value attempted at the moment of the click, and most is not lost: shoppers substitute, return later, or would not have checked out anyway. The method keeps only the fraction that would realistically have converted."
    formula: "SUM(oos_interactions.pot_val) * Paid Conversion Rate of the affected category, restricted to the unavailability window. Resolve the category by joining oos_interactions.art_code to products.product_id and reading products.category_id, then compute the rate over sessions of that SAME category via web_sessions.primary_category_id. A sitewide paid rate gives a materially wrong answer. Use the Paid Conversion Rate, never the Sitewide Conversion Rate."
    synonyms:
    - OOS lost revenue
    - stockout loss
    - unrealized sales
    - missed demand
    bindings:
    - table: oos_interactions
      column: pot_val
    - table: oos_interactions
      column: art_code
    - table: web_sessions
      column: traffic_source
    - table: web_sessions
      column: primary_category_id
    - table: products
      column: product_id
    - table: products
      column: category_id
  - id: safety_stock
    display_name: Safety Stock Level
    category_id: supply_chain
    definition: Minimum threshold buffer quantity maintained in warehouse to prevent
      unexpected stockouts during demand surges.
    formula: safety_stock_level from inventory_items
    synonyms:
    - buffer stock
    - safety inventory
    - reorder point
    bindings:
    - table: inventory_items
      column: safety_stock_level
  - id: dach_region
    display_name: DACH Region
    category_id: logistics
    definition: Central European commercial zone comprising Germany (DE), Austria
      (AT), and Switzerland (CH). It is served from all five distribution centres,
      not a single hub, so DACH performance must never be read as one warehouse's
      performance. In shipping_lead_times the region is always spelled 'DACH';
      in users it is expressed as the individual country.
    formula: destination_region = 'DACH'
    synonyms:
    - DACH
    - German market
    - Central Europe
    - German-speaking region
    bindings:
    - table: shipping_lead_times
      column: destination_region
    - table: users
      column: country
  - id: lead_time_sla
    display_name: Delivery Lead Time SLA
    category_id: logistics
    definition: The promised carrier transit duration displayed to customers at checkout.
      Standard target is 24 hours.
    formula: actual_promised_lead_time_hours vs standard_lead_time_hours
    synonyms:
    - shipping lead time
    - delivery promise
    - transit time
    - shipping speed
    bindings:
    - table: shipping_lead_times
      column: actual_promised_lead_time_hours
  - id: carrier_bottleneck
    display_name: Carrier Capacity Utilization & Bottleneck
    category_id: logistics
    definition: Operational workload percentage of logistics distribution centers
      and freight carriers. Utilization over 90% triggers shipping SLA delays.
    formula: capacity_utilization_pct >= 90.0
    synonyms:
    - logistics bottleneck
    - warehouse congestion
    - carrier overload
    bindings:
    - table: shipping_lead_times
      column: capacity_utilization_pct
  - id: price_index
    display_name: Competitor Price Index Parity
    category_id: pricing_merchandising
    definition: "Ratio of competitor retail prices compared to Lumi\xE8reShop prices\
      \ for identical SKUs. 1.00x denotes exact price parity."
    formula: "competitor_price_feed.competitor_price / products.retail_price"
    synonyms:
    - price parity
    - price index
    - competitive pricing
    - price benchmark
    bindings:
    - table: competitor_price_feed
      column: competitor_price
    - table: competitor_promotions
      column: discount_pct
    - table: products
      column: retail_price
  - id: recommender_mismatch
    display_name: Catalog Recommender Category Mismatch
    category_id: pricing_merchandising
    definition: "Algorithmic failure mode in which the product recommendation engine serves items from a different merchandising category than the page the shopper is viewing. It occurs when the personalised ranking model has no eligible in-category candidate and the global fallback rule is applied instead."
    formula: cat_mismatch_flg = 1 AND fb_rule_id = 99
    synonyms:
    - recommender bug
    - cross-sell failure
    - recommendation mismatch
    - broken substitute
    bindings:
    - table: catalog_recommender_logs
      column: cat_mismatch_flg
    - table: catalog_recommender_logs
      column: opp_cost_eur
  - id: recommender_lost_revenue
    display_name: Recommender Mismatch Lost Revenue
    category_id: pricing_merchandising
    definition: "Revenue not realised because the recommendation widget served an out-of-category product and the shopper abandoned the session. catalog_recommender_logs.opp_cost_eur is a reserved field that is never populated and always reads zero, so it must never be summed. The certified method counts the mismatched impressions the shopper actually bounced on, then applies the Sitewide Conversion Rate for that category and its average order value, because a shopper who reaches a recommendation widget is already on site regardless of the channel that brought them."
    formula: "COUNT(catalog_recommender_logs WHERE cat_mismatch_flg = 1 AND user_action = 'BOUNCED') * Sitewide Conversion Rate for the affected category (all channels, not paid-only) * average order value for that category. Do NOT use SUM(catalog_recommender_logs.opp_cost_eur), which is always zero."
    synonyms:
    - recommender lost revenue
    - substitution loss
    - fallback bug loss
    - recommendation opportunity cost
    bindings:
    - table: catalog_recommender_logs
      column: user_action
    - table: catalog_recommender_logs
      column: cat_mismatch_flg
    - table: catalog_recommender_logs
      column: opp_cost_eur
    - table: orders
      column: total_amount
  - id: psp_gateway_error
    display_name: Payment Service Provider (PSP) Error
    category_id: technical_checkout
    definition: Technical transaction failures, gateway timeouts, or authorization
      declines returned by Stripe, PayPal, or Adyen.
    formula: status = 'FAILED' OR error_code IS NOT NULL
    synonyms:
    - payment failure
    - gateway timeout
    - checkout error
    - credit card decline
    bindings:
    - table: payment_gateway_logs
      column: status
    - table: payment_gateway_logs
      column: error_code
  - id: cookie_consent_mirage
    display_name: Cookie Consent Tracking Attribution Mirage
    category_id: technical_checkout
    definition: Discrepancy where client-side analytics pixels (e.g. Meta Pixel on
      iOS Safari) drop tracking events, while server-side BigQuery order records remain
      healthy.
    formula: orders count vs web_events tracking
    synonyms:
    - cookie tracking drop
    - iOS tracking glitch
    - attribution mirage
    - CMP consent drop
    bindings:
    - table: web_sessions
      column: device_os
    - table: orders
      column: total_amount
  - id: aov
    display_name: AOV (Average Order Value)
    category_id: finance
    definition: Mean gross monetary expenditure per completed customer order.
    formula: SUM(orders.total_amount) / COUNT(orders.order_id)
    synonyms:
    - average order value
    - basket size
    - average checkout amount
    bindings:
    - table: orders
      column: total_amount
    - table: daily_category_targets
      column: target_aov
  - id: target_variance
    display_name: Commercial Target Revenue Variance
    category_id: finance
    definition: The net monetary gap between realized actual gross sales and planned
      financial targets.
    formula: Actual Revenue - Target Revenue
    synonyms:
    - revenue gap
    - target deficit
    - sales variance
    - revenue shortfall
    bindings:
    - table: weekly_commercial_targets
      column: target_revenue
    - table: daily_category_targets
      column: target_revenue
  - id: black_week_promotional_period
    display_name: Black Week Peak Commercial Period
    category_id: finance
    definition: "The annual Q4 retail peak promotional sales period, running 8 days from Monday November 23, 2026 00:00:00 UTC to Monday November 30, 2026 23:59:59 UTC inclusive, and encompassing both Black Friday (November 27) and Cyber Monday (November 30). Evaluated against executive weekly_commercial_targets and daily_category_targets. The executive benchmark for the full 8-day period is EUR 10,700,000; the corresponding benchmark for the portion elapsed at the reporting cutoff of November 27 14:30 UTC is EUR 6,670,000. Comparing period-to-date actuals against the full-period benchmark understates performance and is incorrect."
    formula: "orders.created_at >= '2026-11-23 00:00:00' AND orders.created_at < '2026-12-01 00:00:00'"
    synonyms:
    - Black Week
    - Black Friday
    - Cyber Week
    - Peak Promo Event
    - Black Week 2026
    - Q4 Peak Promotional Period
    - Black Friday Cyber Monday
    - BFCM
    bindings:
    - table: weekly_commercial_targets
      column: week_start_date
    - table: daily_category_targets
      column: date
    - table: orders
      column: created_at
  - id: return_rate
    display_name: Product Return Rate (RMA %)
    category_id: returns_rma
    definition: The percentage of fulfilled retail order items returned by customers
      across categories.
    formula: (COUNT(product_returns.return_id) / COUNT(order_items.order_item_id))
      * 100
    synonyms:
    - return rate
    - RMA percentage
    - product return percentage
    - merchandise return rate
    bindings:
    - table: product_returns
      column: return_id
    - table: order_items
      column: order_item_id
  - id: refund_ratio
    display_name: Customer Refund Value Ratio
    category_id: returns_rma
    definition: Total monetary volume refunded to customer accounts relative to total
      gross checkout merchandise value.
    formula: SUM(customer_refunds.refund_amount) / SUM(orders.total_amount)
    synonyms:
    - refund rate
    - customer refund ratio
    - refund value percentage
    - disbursed refunds
    bindings:
    - table: customer_refunds
      column: refund_amount
    - table: orders
      column: total_amount
  - id: rma_processing_time
    display_name: RMA Return Inspection Processing SLA
    category_id: returns_rma
    definition: Elapsed turnaround time in hours between return authorization receipt
      and physical warehouse triage inspection.
    formula: TIMESTAMP_DIFF(return_inspections.inspected_at, product_returns.created_at,
      HOUR)
    synonyms:
    - return inspection cycle
    - RMA turnaround
    - reverse logistics SLA
    - return cycle time
    bindings:
    - table: return_inspections
      column: inspected_at
    - table: product_returns
      column: created_at
  - id: first_contact_resolution
    display_name: First Contact Resolution (FCR %)
    category_id: customer_service
    definition: The percentage of customer support tickets successfully resolved during
      the initial contact without requiring escalations or repeat interactions.
    formula: (COUNT(tickets resolved at first response) / COUNT(support_tickets.ticket_id))
      * 100
    synonyms:
    - FCR
    - first touch resolution
    - one touch resolution
    - single contact solve
    bindings:
    - table: support_tickets
      column: ticket_id
    - table: support_tickets
      column: status
  - id: csat_score_pct
    display_name: CSAT (Customer Satisfaction Score %)
    category_id: customer_service
    definition: The percentage of satisfied survey responses (rating 4 or 5 out of
      5) submitted following customer support interactions.
    formula: (COUNT(csat_surveys where score >= 4) / COUNT(csat_surveys.survey_id))
      * 100
    synonyms:
    - CSAT
    - customer satisfaction
    - support satisfaction
    - service satisfaction rate
    bindings:
    - table: csat_surveys
      column: score
    - table: csat_surveys
      column: ticket_id
  - id: net_promoter_score
    display_name: NPS (Net Promoter Score)
    category_id: customer_service
    definition: Customer advocacy index calculated as the percentage of brand Promoters
      (ratings 9-10) minus Detractors (ratings 0-6).
    formula: '% Promoters (Score 9-10) - % Detractors (Score 0-6)'
    synonyms:
    - NPS
    - net promoter score
    - customer advocacy
    - brand loyalty index
    bindings:
    - table: nps_feedback_responses
      column: score
  - id: ticket_sla_compliance
    display_name: Helpdesk Ticket SLA Compliance Rate
    category_id: customer_service
    definition: The percentage of support tickets resolved strictly within the defined
      category SLA target duration in minutes.
    formula: (COUNT(tickets where resolution_time_sec <= sla_target_minutes * 60)
      / COUNT(tickets)) * 100
    synonyms:
    - support SLA compliance
    - helpdesk SLA rate
    - case resolution SLA
    - ticket SLA adherence
    bindings:
    - table: support_tickets
      column: resolution_time_sec
    - table: ticket_categories
      column: sla_target_minutes
  - id: supplier_on_time_in_full_otif
    display_name: Supplier OTIF (On-Time In-Full Delivery %)
    category_id: supply_chain
    definition: Inbound supply chain delivery performance metric measuring vendor
      purchase orders received strictly on schedule and complete.
    formula: supplier_quality_scorecards.otif_delivery_pct
    synonyms:
    - OTIF
    - on time in full
    - vendor delivery reliability
    - procurement fulfillment rate
    bindings:
    - table: supplier_quality_scorecards
      column: otif_delivery_pct
    - table: purchase_orders
      column: po_id
  - id: supplier_defect_rate
    display_name: Supplier Inbound Defect Rate (%)
    category_id: supply_chain
    definition: The percentage of received procurement units rejected during inbound
      warehouse quality inspection due to manufacturer defects.
    formula: supplier_quality_scorecards.defect_rate_pct
    synonyms:
    - vendor defect rate
    - inbound scrap rate
    - supplier defect percentage
    - material rejection rate
    bindings:
    - table: supplier_quality_scorecards
      column: defect_rate_pct
    - table: purchase_order_line_items
      column: unit_cost_eur
  - id: dock_turnaround_time
    display_name: Inbound Freight Dock Turnaround Time
    category_id: supply_chain
    definition: The duration in minutes taken to unload, inspect, and stage freight
      carrier shipments at warehouse inbound dock doors.
    formula: TIMESTAMP_DIFF(unloaded_time, scheduled_time, MINUTE)
    synonyms:
    - dock dwell time
    - inbound unloading duration
    - dock door turnaround
    - dock cycle time
    bindings:
    - table: inbound_dock_appointments
      column: unloaded_time
    - table: inbound_dock_appointments
      column: scheduled_time
  - id: gross_margin_pct
    display_name: Gross Margin Percentage (GM %)
    category_id: finance
    definition: The proportion of total e-commerce revenue retained after subtracting
      product acquisition and manufacturing costs of goods sold (COGS).
    formula: ((SUM(sale_price) - SUM(cost)) / SUM(sale_price)) * 100
    synonyms:
    - gross profit margin
    - product margin
    - COGS margin
    - gross margin
    bindings:
    - table: products
      column: cost
    - table: products
      column: retail_price
    - table: order_items
      column: sale_price
  - id: days_sales_outstanding_dso
    display_name: DSO (Days Sales Outstanding)
    category_id: finance
    definition: Corporate financial liquidity metric measuring the average number
      of calendar days required to collect invoice receivables from corporate clients.
    formula: (Accounts Receivable Balance / Total Credit Sales) * Number of Days
    synonyms:
    - DSO
    - receivable collection days
    - AR collection period
    - days sales outstanding
    bindings:
    - table: accounts_receivable_invoices
      column: billed_amount_eur
    - table: accounts_receivable_invoices
      column: due_date
  - id: vat_effective_rate
    display_name: Effective VAT Tax Collection Rate
    category_id: finance
    definition: The realized value-added tax percentage collected across European
      destination jurisdictions.
    formula: (vat_collected_eur / taxable_sales_eur) * 100
    synonyms:
    - VAT rate
    - sales tax rate
    - effective tax rate
    - destination VAT
    bindings:
    - table: vat_tax_jurisdictions
      column: standard_vat_rate_pct
    - table: vat_period_filing_reports
      column: vat_collected_eur
  - id: points_breakage_rate
    display_name: Loyalty Points Breakage Rate (%)
    category_id: loyalty_retention
    definition: The percentage of customer loyalty points issued that will expire
      unredeemed based on historical expiration patterns.
    formula: (Expired Points / Total Issued Points) * 100
    synonyms:
    - points breakage
    - unredeemed loyalty points
    - points expiration rate
    - breakage percentage
    bindings:
    - table: loyalty_points_ledger
      column: points_delta
    - table: loyalty_members
      column: total_points_balance
  - id: loyalty_redemption_rate
    display_name: Loyalty Reward Points Redemption Rate
    category_id: loyalty_retention
    definition: The proportion of accumulated member loyalty points converted into
      commercial reward redemptions and discounts.
    formula: "(SUM(loyalty_reward_redemptions.points_spent) / SUM(loyalty_points_ledger.points_delta)) * 100"
    synonyms:
    - reward redemption rate
    - loyalty burn rate
    - point redemption percentage
    - points utilization
    bindings:
    - table: loyalty_reward_redemptions
      column: points_spent
    - table: loyalty_points_ledger
      column: points_delta
  - id: customer_lifetime_value_clv
    display_name: CLV (Customer Lifetime Value)
    category_id: loyalty_retention
    definition: The predicted total gross merchandise value generated by an individual
      customer account over their lifetime.
    formula: Average Order Value * Purchase Frequency * Customer Lifespan
    synonyms:
    - CLV
    - LTV
    - customer lifetime value
    - lifetime customer GMV
    bindings:
    - table: orders
      column: total_amount
    - table: loyalty_members
      column: user_id
  - id: same_store_sales_growth
    display_name: Same-Store Sales Growth (SSS %)
    category_id: omnichannel_pos
    definition: Year-over-year commercial sales revenue growth percentage generated
      across physical retail store locations open for at least one full calendar year.
    formula: ((Current Year Store Revenue - Prior Year Store Revenue) / Prior Year
      Store Revenue) * 100
    synonyms:
    - comp store sales
    - same store sales
    - like-for-like sales
    - LFL store growth
    - SSS growth
    bindings:
    - table: pos_store_transactions
      column: total_amount_eur
    - table: physical_store_locations
      column: store_id
  - id: bopis_fulfillment_rate
    display_name: BOPIS (Buy-Online-Pick-Up-in-Store) Completion Rate
    category_id: omnichannel_pos
    definition: The percentage of Click & Collect orders successfully collected by
      customers at physical retail stores within promised pickup SLAs.
    formula: (COUNT(collected BOPIS orders) / COUNT(total BOPIS orders)) * 100
    synonyms:
    - click and collect completion
    - BOPIS fulfillment
    - store pickup rate
    - omnichannel pickup SLA
    bindings:
    - table: click_and_collect_orders
      column: status
    - table: click_and_collect_orders
      column: collected_at
  - id: catalog_completeness_pct
    display_name: Catalog Attribute Completeness (%)
    category_id: product_pim
    definition: Product Information Management (PIM) data quality score measuring
      the percentage of mandatory product attributes populated across catalog SKUs.
    formula: (Populated Mandatory Attributes / Total Required Attributes) * 100
    synonyms:
    - PIM completeness
    - catalog data quality
    - attribute coverage percentage
    - catalog health score
    bindings:
    - table: product_attribute_values
      column: value_id
    - table: product_attribute_definitions
      column: attribute_id
  - id: email_deliverability_rate
    display_name: Lifecycle Email Deliverability Rate (%)
    category_id: marketing
    definition: The percentage of broadcast lifecycle and promotional marketing emails
      successfully delivered to recipient inboxes without bounce rejections.
    formula: ((Total Sent Emails - Hard Bounces) / Total Sent Emails) * 100
    synonyms:
    - email deliverability
    - inbox delivery rate
    - email bounce rate
    - marketing email deliverability
    bindings:
    - table: email_send_queue_logs
      column: status
    - table: email_bounces_and_complaints
      column: bounce_type
  - id: rma_authorization_rate
    display_name: RMA Authorization Rate
    category_id: returns_rma
    definition: Percentage of completed orders that result in a return merchandise
      authorization (RMA) request.
    formula: COUNT(DISTINCT product_returns.return_id) / COUNT(DISTINCT orders.order_id)
    synonyms:
    - return rate
    - return merchandise authorization
    - RMA percentage
    - order return ratio
    bindings:
    - table: product_returns
      column: return_id
    - table: return_reasons_lookup
      column: reason_code
  - id: defective_return_rate
    display_name: Defective Inspection Rate
    category_id: returns_rma
    definition: Ratio of returned items classified as defective or damaged upon warehouse
      triage inspection.
    formula: "COUNTIF(return_inspections.item_condition = 'DEFECTIVE') / COUNT(return_inspections.inspection_id)"
    synonyms:
    - damaged return rate
    - inspection defect ratio
    - faulty goods percentage
    bindings:
    - table: return_inspections
    - table: return_shipping_labels
      column: tracking_number
  - id: refund_processing_latency
    display_name: Refund Payout Processing Latency
    category_id: returns_rma
    definition: Average duration in hours from customer return receipt to financial
      refund disbursement.
    formula: "AVG(TIMESTAMP_DIFF(customer_refunds.processed_at, product_returns.created_at, HOUR))"
    synonyms:
    - refund turnaround time
    - refund payout speed
    - customer refund delay
    bindings:
    - table: customer_refunds
    - table: product_returns
      column: created_at
  - id: first_contact_resolution_rate
    display_name: First Contact Resolution (FCR) Rate
    category_id: customer_service
    definition: Percentage of incoming support tickets resolved in a single interaction
      without follow-up escalation.
    formula: "COUNTIF(support_tickets.status = 'RESOLVED' AND support_tickets.resolution_time_sec = support_tickets.first_response_time_sec) / COUNT(support_tickets.ticket_id)"
    synonyms:
    - FCR
    - one-touch resolution
    - single contact fix rate
    bindings:
    - table: support_tickets
      column: status
    - table: ticket_categories
  - id: ticket_backlog_volume
    display_name: Customer Support Ticket Backlog
    category_id: customer_service
    definition: Total count of unresolved or pending customer service tickets across
      support queues.
    formula: COUNTIF(support_tickets.status IN ('OPEN', 'PENDING', 'IN_PROGRESS'))
    synonyms:
    - support backlog
    - open ticket queue
    - unresolved ticket count
    - helpdesk queue depth
