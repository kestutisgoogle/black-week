    - table: stg_klaviyo_campaigns_raw
    - table: stg_stripe_payment_intents_raw
      column: raw_payload
    - table: stg_stripe_disputes_raw
    - table: stg_adyen_settlements_raw
    - table: stg_zendesk_tickets_raw
    - table: stg_zendesk_satisfaction_raw
    - table: stg_sap_erp_inventory_feed_raw
    - table: stg_sap_erp_purchase_orders_raw
