  - id: paid_roas
    display_name: "Paid ROAS (Paid-Attributed Return on Ad Spend)"
    category_id: marketing
    definition: "Return on ad spend counted using only revenue from sessions whose traffic source is a paid channel. This is the figure the advertising platform's automated bidding strategy optimises against, and therefore the figure that determines whether a campaign is judged to have breached its ROAS target and had its budget capped. It is materially lower than the blended figure because it excludes organic, direct, email and affiliate revenue."
    formula: "SUM(orders.total_amount) for orders joined to web_sessions on orders.session_id where web_sessions.traffic_source is a paid channel, divided by SUM(daily_ad_performance.spend)"
    synonyms:
    - "paid return on ad spend"
    - "campaign ROAS"
    - "ad-attributed ROAS"
    - "platform ROAS"
    - "bidding ROAS"
    bindings:
    - table: orders
      column: total_amount
    - table: orders
      column: session_id
    - table: web_sessions
      column: traffic_source
    - table: daily_ad_performance
      column: spend
    - table: ad_bidding_log
      column: target_roas_multiplier
  - id: blended_roas
    display_name: "Blended ROAS (Total Revenue Return on Ad Spend)"
    category_id: marketing
    definition: "Return on ad spend counted using all revenue for the category regardless of acquisition channel, divided by advertising spend. This is the convention used in the commercial plan, where the planned value is stored as daily_category_targets.target_roas. Because it credits advertising with organic, direct, email and affiliate revenue it is roughly twice the paid-attributed figure. The two conventions must never be compared with one another."
    formula: "SUM(orders.total_amount) across all channels divided by SUM(daily_ad_performance.spend). The planned equivalent is daily_category_targets.target_roas."
    synonyms:
    - "blended return on ad spend"
    - "total ROAS"
    - "commercial ROAS"
    - "plan ROAS"
    - "all-channel ROAS"
    bindings:
    - table: daily_category_targets
      column: target_roas
    - table: daily_ad_performance
      column: spend
    - table: orders
      column: total_amount
  - id: paid_cvr
    display_name: "Paid Conversion Rate (Paid Sessions Only)"
    category_id: marketing
    definition: "Conversion rate measured only over sessions arriving from paid channels: completed orders from paid sessions divided by paid sessions. This is the convention used in campaign performance review and in any comparison of realised conversion against the planned conversion rate for acquisition. It is not the same as the sitewide rate and the two are frequently confused. When this rate qualifies a metric belonging to one product category, compute it over the paid sessions of that category alone, via web_sessions.primary_category_id. The all-category paid rate and a single category paid rate differ materially, and substituting one for the other is a silent error."
    formula: "COUNT(DISTINCT orders.order_id) for orders whose session is paid, divided by COUNT(DISTINCT web_sessions.session_id) where web_sessions.traffic_source is a paid channel"
    synonyms:
    - "paid conversion rate"
    - "campaign conversion rate"
    - "acquisition CVR"
    - "paid traffic conversion"
    bindings:
    - table: web_sessions
      column: traffic_source
    - table: web_sessions
      column: session_id
    - table: orders
      column: session_id
    - table: orders
      column: order_id
    - table: daily_category_targets
      column: target_conversion_rate
  - id: sitewide_cvr
    display_name: "Sitewide Conversion Rate (All Sessions)"
    category_id: marketing
    definition: "Conversion rate measured over every session regardless of channel: all completed orders divided by all sessions. This is the convention used for overall trading performance. Reporting the sitewide figure where a paid-only figure is required, or the reverse, produces a materially wrong conclusion about campaign health."
    formula: "COUNT(DISTINCT orders.order_id) / COUNT(DISTINCT web_sessions.session_id)"
    synonyms:
    - "sitewide conversion rate"
    - "overall conversion rate"
    - "total CVR"
    - "site conversion"
    bindings:
    - table: orders
      column: order_id
    - table: web_sessions
      column: session_id
    - table: web_sessions
      column: converted_to_order
  - id: placed_order
    display_name: "Placed Order (order_status Convention)"
    category_id: finance
    definition: "NEVER filter to order_status = 'Completed' when counting orders or revenue. It is not a validity filter and silently discards 5.86 percent of real orders - 7,554 of the 128,997 in the warehouse. Every row in orders is a genuinely placed, paid-for order; order_status only records what happened AFTERWARDS - 'Completed' (nothing sent back), 'Partially Returned' (some lines returned), 'Returned' (all lines returned). All three count. For revenue after returns use order_items.returned_at, which is per line and is the only exact basis. Failed payment attempts never become orders; they appear only in payment_gateway_logs with a NULL order_id."
    formula: "COUNT or SUM across all three order_status values. Never filter to 'Completed' alone; use order_items.returned_at for any returns adjustment."
    synonyms:
    - "placed order"
    - "valid order"
    - "order status"
    - "fulfilment status"
    bindings:
    - table: orders
      column: order_status
    - table: order_items
      column: returned_at
    - table: payment_gateway_logs
      column: order_id
  - id: gross_revenue
    display_name: "Gross Merchandise Revenue"
    category_id: finance
    definition: "Merchandise revenue before any deduction for returned items. Equals the sum of line value across order items, and is the value carried on orders.total_amount. It excludes value added tax, held separately in orders.tax_amount, and delivery charges, held separately in orders.shipping_fee. Neither tax nor delivery is part of revenue at LumiereShop."
    formula: "SUM(order_items.sale_price * order_items.quantity), equivalently SUM(orders.total_amount). Excludes orders.tax_amount and orders.shipping_fee."
    synonyms:
    - "gross revenue"
    - "gross merchandise value"
    - "GMV"
    - "gross sales"
    - "merchandise revenue"
    bindings:
    - table: orders
      column: total_amount
    - table: orders
      column: tax_amount
    - table: orders
      column: shipping_fee
    - table: order_items
      column: sale_price
    - table: order_items
      column: quantity
  - id: net_revenue
    display_name: "Net Merchandise Revenue (After Returns)"
    category_id: finance
    definition: "Merchandise revenue after deducting the value of items that were subsequently returned. An order item counts as returned when order_items.returned_at is populated. Net revenue is the correct basis for margin and commercial performance reporting. Gross revenue overstates trading by the return rate, which runs at roughly five percent of items, so the two figures will never agree and the difference is not an error."
    formula: "SUM(order_items.sale_price * order_items.quantity) excluding rows where order_items.returned_at IS NOT NULL"
    synonyms:
    - "net revenue"
    - "net sales"
    - "revenue after returns"
    - "returns-adjusted revenue"
    bindings:
    - table: order_items
      column: sale_price
    - table: order_items
      column: quantity
    - table: order_items
      column: returned_at
    - table: orders
      column: total_amount
  - id: target_to_date
    display_name: "Target To Date (Pro-Rated Plan)"
    category_id: finance
    definition: "The share of a period's commercial plan that should have been achieved by a given moment. Plans are stored for whole periods, so a period-to-date actual must always be compared against a pro-rated plan and never against the whole-period figure. At the reporting cutoff of November 27, 2026 at 14:30 UTC, 62.35 percent of the Black Week plan window has elapsed, giving a to-date benchmark of EUR 6,670,000 against a full-period plan of EUR 10,700,000. Quarter-hour planned weights are held in category_15min_targets, which is the authoritative source for pro-rating; the plan is not spread evenly across the period."
    formula: "SUM(category_15min_targets.target_revenue) over the quarter-hour buckets that have elapsed at the reporting cutoff"
    synonyms:
    - "target to date"
    - "pro-rated target"
    - "plan to date"
    - "expected to date"
    - "phased target"
    - "pacing target"
    bindings:
    - table: category_15min_targets
      column: target_revenue
    - table: category_15min_targets
      column: time_bucket
    - table: daily_category_targets
      column: target_revenue
    - table: weekly_commercial_targets
      column: target_revenue
  - id: pacing_variance
    display_name: "Pacing Variance (Actual vs Pro-Rated Plan)"
    category_id: finance
    definition: "Performance to date expressed as a variance against the pro-rated plan to date. A negative variance means trading is behind plan. Measuring actuals to date against the full-period plan rather than the pro-rated plan is the single most common reporting error during a promotional period, and it always makes trading look far worse than it is."
    formula: "(SUM(orders.total_amount) to date - SUM(category_15min_targets.target_revenue) to date) / SUM(category_15min_targets.target_revenue) to date"
    synonyms:
    - "pacing variance"
    - "plan variance"
    - "pacing gap"
    - "variance to plan"
    - "performance vs plan"
    bindings:
    - table: orders
      column: total_amount
    - table: orders
      column: created_at
    - table: category_15min_targets
      column: target_revenue
  - id: product_key_equivalence
    display_name: "Product Key Equivalence Across Source Systems"
    category_id: data_governance
    definition: "Four source systems name the product identifier differently, but all of them hold the same integer value as products.product_id, so they join directly with no mapping table and no transformation. The enterprise resource planning extract calls it order_items.mat_nr, the material number. The webshop calls it oos_interactions.art_code, the article code. The recommendation engine calls it catalog_recommender_logs.src_sku for the item being viewed and catalog_recommender_logs.rec_sku for the item being recommended."
    formula: "products.product_id = order_items.mat_nr = oos_interactions.art_code = catalog_recommender_logs.src_sku = catalog_recommender_logs.rec_sku"
    synonyms:
    - "product key"
    - "material number"
    - "article code"
    - "SKU equivalence"
    - "product identifier mapping"
    - "cross-system product key"
    bindings:
    - table: products
      column: product_id
    - table: order_items
      column: mat_nr
    - table: oos_interactions
      column: art_code
    - table: catalog_recommender_logs
      column: src_sku
    - table: catalog_recommender_logs
      column: rec_sku
  - id: order_key_equivalence
    display_name: "Order Header Key Equivalence"
    category_id: data_governance
    definition: "The order header identifier appears under two names. orders.order_id is the canonical key. order_items.ord_hdr_num carries the same value as emitted by the order management system. Join order items to order headers on these two columns."
    formula: "orders.order_id = order_items.ord_hdr_num"
    synonyms:
    - "order key"
    - "order header number"
    - "order id mapping"
    bindings:
    - table: orders
      column: order_id
    - table: order_items
      column: ord_hdr_num
  - id: unpopulated_columns
    display_name: "Known Unpopulated Columns (Reserved Fields)"
    category_id: data_governance
    definition: "Some numeric columns exist in the physical schema but are not populated by any source system and always read zero. order_items.discount_amount and sales_event_stream.discount_amount are reserved for a promotions feed that is not yet connected. catalog_recommender_logs.opp_cost_eur is a reserved estimate field. Do not aggregate these columns and do not report them as business facts. A total of zero reflects an absent feed, not an absence of discounting."
    formula: "order_items.discount_amount, sales_event_stream.discount_amount and catalog_recommender_logs.opp_cost_eur are reserved and always zero"
    synonyms:
    - "reserved columns"
    - "unpopulated fields"
    - "not populated"
    - "empty columns"
    bindings:
    - table: order_items
      column: discount_amount
    - table: sales_event_stream
      column: discount_amount
    - table: catalog_recommender_logs
      column: opp_cost_eur
