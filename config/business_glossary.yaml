      column: priority
    - table: ticket_messages
      column: sender_type
  - id: csat_net_score
    display_name: CSAT (Customer Satisfaction Score)
    category_id: customer_service
    definition: Average customer satisfaction rating recorded on post-ticket resolution
      surveys on a 1-5 scale.
    formula: "AVG(csat_surveys.score)"
    synonyms:
    - customer satisfaction
    - CSAT rating
    - support quality score
    - customer happiness index
    bindings:
    - table: csat_surveys
    - table: support_agents
  - id: customer_escalation_rate
    display_name: Customer Escalation Rate
    category_id: customer_service
    definition: Percentage of customer support inquiries escalated to senior management
