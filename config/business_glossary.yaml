    display_name: General Ledger (GL) Debit-Credit Balance
    category_id: finance
    definition: Double-entry bookkeeping validation ensuring total debits equal total
      credits across all posted journal lines.
    formula: SUM(gl_journal_lines.debit_amount_eur) - SUM(gl_journal_lines.credit_amount_eur)
    synonyms:
