  - id: this_week
    display_name: This Week (Black Week 2026)
    category_id: temporal_context
    definition: "In Lumi\xE8reShop operations, 'this week' (or 'current week') refers\
      \ to Black Week 2026 (the promotional week starting Monday, November 23, 2026\
      \ through Monday, November 30, 2026 / Cyber Monday). For actual transactions,\
      \ inventory, and marketing events, records are available from Monday, November\
      \ 23, 2026 00:00:00 UTC up to the latest reporting cutoff of Friday, November 27, 2026\
      \ 14:30:00 UTC. Planned target pacing tables cover the entire 8-day promotional\
      \ week (November 23\u201330, 2026)."
    formula: created_at BETWEEN '2026-11-23 00:00:00 UTC' AND '2026-11-27 14:30:00
      UTC'
    synonyms:
    - this week
    - current week
    - black week
    - black week 2026
    - promotional week
    - wtd
    - week to date
    - the week so far
    - current promotional week
    - sales this week
    bindings:
    - table: orders
      column: created_at
    - table: order_items
      column: created_at
    - table: daily_category_targets
      column: date
    - table: weekly_commercial_targets
      column: week_start_date
    - table: daily_ad_performance
      column: date
    - table: sales_event_stream
      column: timestamp
    - table: web_sessions
      column: session_started_at
  - id: today
    display_name: Today (Black Friday 2026-11-27)
    category_id: temporal_context
    definition: "In Lumi\xE8reShop operations, 'today' refers to Black Friday (Friday,\
      \ November 27, 2026) from 00:00:00 UTC up to the reporting cutoff at 14:30:00\
      \ UTC. SQL queries filtering for 'today' or 'today's sales' must filter for date\
      \ '2026-11-27' or timestamp range between '2026-11-27 00:00:00 UTC' and '2026-11-27\
      \ 14:30:00 UTC'."
    formula: DATE(created_at) = '2026-11-27' AND created_at <= '2026-11-27 14:30:00
      UTC'
    synonyms:
    - today
    - current day
    - this day
    - black friday
    - black friday 2026
    - today's actuals
    - today so far
    - friday actuals
    - today's data
    - today's sales
    bindings:
    - table: orders
      column: created_at
    - table: order_items
      column: created_at
    - table: category_15min_targets
      column: day_of_week
    - table: daily_category_targets
      column: date
    - table: daily_ad_performance
      column: date
    - table: web_sessions
      column: session_started_at
    - table: sales_event_stream
      column: timestamp
  - id: yesterday
    display_name: Yesterday (Black Thursday / Thanksgiving 2026-11-26)
    category_id: temporal_context
    definition: "In the Lumi\xE8reShop simulation, 'yesterday' refers to the full\
      \ calendar day preceding Black Friday, which is Thursday, November 26, 2026\
      \ (Thanksgiving / Black Thursday). SQL queries filtering for 'yesterday' must\
      \ filter for DATE = '2026-11-26' or timestamp between '2026-11-26 00:00:00 UTC'\
      \ and '2026-11-26 23:59:59 UTC'."
